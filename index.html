html{scroll-behavior:smooth;scroll-padding-top:120px}

h1,h2,h3{font-family:Georgia,"Times New Roman","Noto Naskh Arabic","Traditional Arabic",serif;line-height:1.2}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

.badge{background:var(--sun);color:#1a1300;border-radius:999px;font-size:.75rem;padding:1px 7px;margin-inline-start:6px;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav a{color:#d6e6df;text-decoration:none;padding:6px 12px;border-radius:999px;white-space:nowrap;font-size:.95rem}
nav a:hover{background:rgba(255,255,255,.14);color:#fff}
.hero{background:var(--brand);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.14;background:conic-gradient(from 45deg at 50% 50%,#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/46px 46px}
.hero .wrap{position:relative;padding-block:clamp(36px,8vw,84px);max-width:760px;margin-inline:0 auto}
[dir=rtl] .hero .wrap{margin-inline:auto 0}
.hero h1{font-size:clamp(2rem,6vw,3.5rem);margin-bottom:14px}

.btn{display:inline-block;background:var(--sun);color:#1a1300;border:0;border-radius:12px;padding:12px 22px;font-weight:700;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.wa{background:#1fa855;color:#fff;width:100%;font-size:1.05rem}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
section{padding-block:36px}
h2{font-size:1.6rem;margin-bottom:16px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cat{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 10px;text-align:center;font-weight:600}
.cat .e{font-size:2rem;display:block}
.cat:hover,.cat.on{border-color:var(--brand);background:#e9f2ee}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1 1 240px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee}
.card .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card small{color:var(--mute)}
.price{font-weight:800;color:var(--brand);font-size:1.1rem}
.card .btn{margin-top:auto;padding:10px;text-align:center;background:var(--brand);color:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 0;grid-column:1/-1}
footer{background:var(--brand2);color:#c4d8cf;padding-block:28px;font-size:.92rem}
footer a{color:var(--sun)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100%);background:#fff;z-index:40;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1.3rem}
.x{background:none;border:0;font-size:1.6rem;line-height:1}
.db{overflow-y:auto;padding:12px 16px 20px;flex:1}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.q{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;margin-top:4px}
.q button{border:0;background:none;width:30px;height:30px;font-size:1.1rem}
.q span{min-width:26px;text-align:center}
.rm{background:none;border:0;color:var(--red);font-size:.85rem;text-decoration:underline}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding:14px 0}
label{display:block;font-weight:600;font-size:.92rem;margin-top:10px}
.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:4px;background:#fff}
.f.bad{border-color:var(--red)}
.err{color:var(--red);font-size:.82rem;min-height:1em}
.note{font-size:.8rem;color:var(--mute);margin-top:10px}
.toast{position:fixed;inset-inline:0;bottom:20px;margin-inline:auto;width:max-content;max-width:90%;background:#13201b;color:#fff;padding:10px 18px;border-radius:999px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

#admin[hidden]{display:none}
.ap{background:#fff;border-radius:var(--r);width:min(880px,100%)}
.ag{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:760px){.ag{grid-template-columns:1fr 1fr}}
.ab{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn.del{background:var(--red);color:#fff}
.help{background:#fff7e0;border:1px solid #ecd48a;border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:14px}
.prev{width:120px;height:120px;object-fit:cover;border-radius:10px;margin-top:8px;display:block;background:#eee}
.prev[hidden]{display:none}
.al{max-height:60vh;overflow-y:auto}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card .b{padding:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<header>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="#home">Dar El <span>Baraka</span></a>

<main>

  </div>

  <section id="categories"><div class="wrap">
    <h2 data-i="cats"></h2>
    <div class="cats" id="cats"></div>
  </div></section>

  <section id="shop"><div class="wrap">
    <h2 data-i="shop"></h2>
    <div class="tools">
      <input class="search" id="q" type="search" data-ph="search" autocomplete="off">
    </div>
    <div class="grid" id="grid"></div>
  </div></section>
</main>

<footer id="contact"><div class="wrap">
  <strong>Dar El Baraka</strong><br>
  <span data-i="foot1"></span><br>
  <a id="waLink" href="#" target="_blank" rel="noopener">WhatsApp</a> &nbsp;|&nbsp; <a href="#admin">Admin</a>
  <p class="note" data-i="foot2"></p>
</div></footer>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="Cart" aria-hidden="true">

    <div id="items"></div>

      <label for="cPhone" data-i="phone"></label>

      <label for="cCity" data-i="city"></label>

      <datalist id="wilayas"></datalist>
      <label for="cAddr" data-i="addr"></label>
      <input class="f" id="cAddr" autocomplete="street-address"><div class="err" id="eAddr"></div>
      <button class="btn wa" id="order" style="margin-top:14px" data-i="order"></button>
      <button class="btn ghost" id="orderOnline" style="margin-top:10px;width:100%" data-i="orderOnline"></button>
      <p class="note" data-i="note"></p>
    </div>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

function renderCats(){
  const all = [{id:"all",e:"✨",fr:T.fr.all,ar:T.ar.all}, ...CATEGORIES];
  $("#cats").innerHTML = all.map(c => `<button class="cat ${c.id===cat?"on":""}" data-cat="${c.id}"><span class="e">${c.e}</span>${nm(c)}</button>`).join("");
}

function renderGrid(){
  const q = $("#q").value.trim().toLowerCase();
  const list = PRODUCTS.filter(p => (cat==="all"||p.cat===cat) && (p.fr+" "+p.ar).toLowerCase().includes(q));
  $("#grid").innerHTML = list.length ? list.map(p => {
    const c = CATEGORIES.find(x => x.id===p.cat);
    return `<article class="card"><img src="${p.img||ph(p)}" alt="${nm(p)}" loading="lazy" data-id="${p.id}"><div class="b"><small>${nm(c)}</small><h3 style="font-size:1rem">${nm(p)}</h3><div class="price">${money(p.price)}</div><button class="btn" data-add="${p.id}">${t("add")}</button></div></article>`;
  }).join("") : `<p class="empty">${t("none")}</p>`;
}

function renderCart(){
  Object.keys(cart).forEach(id => { if (!find(id)) delete cart[id]; });
  const ids = Object.keys(cart);
  let total = 0, n = 0;
  $("#items").innerHTML = ids.length ? ids.map(id => {
    const p = find(id), q = cart[id]; total += p.price*q; n += q;
    return `<div class="item"><img src="${p.img||ph(p)}" alt="" data-id="${p.id}"><div><strong>${nm(p)}</strong><div>${money(p.price)}</div><div class="q"><button data-dec="${id}" aria-label="-">−</button><span>${q}</span><button data-inc="${id}" aria-label="+">+</button></div></div><div style="text-align:end"><div class="price">${money(p.price*q)}</div><button class="rm" data-rm="${id}">${t("remove")}</button></div></div>`;
  }).join("") : `<p class="empty">${t("empty")}</p>`;
  $("#checkout").style.display = ids.length ? "" : "none";
  $("#total").textContent = money(total);
  $("#count").textContent = n;
  save();
}

function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),3200); }
function openCart(on){ $("#drawer").classList.toggle("on",on); $("#ov").classList.toggle("on",on); $("#drawer").setAttribute("aria-hidden",!on); document.body.style.overflow = on ? "hidden" : ""; }

/* Image fallback if a custom image path is wrong */
document.addEventListener("error", e => {
  if (e.target.tagName==="IMG" && e.target.dataset.id){ const p=find(e.target.dataset.id); e.target.onerror=null; e.target.src=ph(p); }
}, true);

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.cat){ cat = d.cat; renderCats(); renderGrid(); document.getElementById("shop").scrollIntoView(); }
  else if (d.add){ cart[d.add] = (cart[d.add]||0)+1; renderCart(); toast(t("added")); }
  else if (d.inc){ cart[d.inc]++; renderCart(); }
  else if (d.dec){ if (--cart[d.dec] < 1) delete cart[d.dec]; renderCart(); }
  else if (d.rm){ delete cart[d.rm]; renderCart(); }
});
$("#cartBtn").onclick = () => openCart(true);
$("#close").onclick = $("#ov").onclick = () => openCart(false);
document.addEventListener("keydown", e => { if (e.key==="Escape") openCart(false); });
$("#langBtn").onclick = () => { lang = lang==="fr" ? "ar" : "fr"; applyLang(); };
$("#q").addEventListener("input", renderGrid);

/* Validation */
function normPhone(v){
  let s = v.replace(/[\s.\-()]/g,"");
  s = s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)); // Arabic-Indic digits
  if (s.startsWith("+213")) s = "0"+s.slice(4);
  else if (s.startsWith("00213")) s = "0"+s.slice(5);
  return s;
}
function validate(){
  const v = {name:$("#cName").value.trim(), phone:normPhone($("#cPhone").value), city:$("#cCity").value.trim(), addr:$("#cAddr").value.trim()};
  const rules = {Name:v.name.length>=2, Phone:/^0[567]\d{8}$/.test(v.phone)||/^0[23489]\d{7,8}$/.test(v.phone), City:v.city.length>=2, Addr:v.addr.length>=5};
  let ok = true, first = null;
  for (const k in rules){
    $("#e"+k).textContent = rules[k] ? "" : t("e"+k);
    $("#c"+k).classList.toggle("bad", !rules[k]);
    if (!rules[k]){ ok=false; first = first || $("#c"+k); }
  }
  if (first) first.focus();
  return ok ? v : null;
}

function buildOrder(v){
  let total = 0;
  const lines = Object.keys(cart).map((id,i) => { const p=find(id), q=cart[id]; total+=p.price*q; return `${i+1}. ${nm(p)} × ${q} = ${money(p.price*q)}`; });
  return `🛒 *${t("msgHead")} – ${STORE_NAME}*\n\n*${t("msgItems")}:*\n${lines.join("\n")}\n\n*${t("msgTotal")}: ${money(total)}*\n${t("msgFee")}\n\n👤 ${t("msgCust")}: ${v.name}\n📞 ${t("msgPhone")}: ${v.phone}\n📍 ${t("msgCity")}: ${v.city}\n🏠 ${t("msgAddr")}: ${v.addr}`;
}

$("#order").onclick = () => {
  if (!Object.keys(cart).length) return;
  const v = validate(); if (!v) return;
  const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(buildOrder(v));
  const w = window.open(url, "_blank", "noopener");
  if (!w) location.href = url; // popup blocked (some mobile browsers)
};

$("#orderOnline").onclick = async () => {
  if (!Object.keys(cart).length || !SHEETS_URL) return;
  const v = validate(); if (!v) return;
  const btn = $("#orderOnline");
  btn.disabled = true; btn.textContent = t("sending");
  let total = 0;
  const items = Object.keys(cart).map(id => { const p = find(id), q = cart[id]; total += p.price*q; return `${p.fr} × ${q} = ${p.price*q} DA`; }).join("\n");
  try {
    // no-cors: the request is sent to your Apps Script; the browser cannot read the reply
    await fetch(SHEETS_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({name:v.name, phone:v.phone, city:v.city, address:v.addr, items, total})});
    cart = {}; renderCart(); openCart(false); toast(t("sentOk"));
  } catch(err) {
    toast(t("sentFail"));
  } finally {
    btn.disabled = false; btn.textContent = t("orderOnline");
  }
};

const a = k => A[lang][k];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = s => s.replace(/[<>"]/g, "").trim();
const adm = document.createElement("div"); adm.id = "admin"; adm.hidden = true; document.body.appendChild(adm);
let unlocked = false, pwMode = false, editing = null, imgData = "";
try { unlocked = sessionStorage.getItem("adm") === "1"; } catch(e){}

async function hashPw(pw){
  const s = "dar|" + STORE_NAME + "|" + pw;
  try { if (window.crypto && crypto.subtle) return [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2,"0")).join(""); } catch(e){}
  let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0; return "x"+h;
}
function saveDraft(){
  try { localStorage.setItem("draft", JSON.stringify({products:PRODUCTS, adminHash:ADMIN_HASH})); return true; }
  catch(e){ toast(a("full")); return false; }
}
function resizeImg(file){
  return new Promise((ok,no) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 560/Math.max(im.width,im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
      ok(c.toDataURL("image/jpeg", .72)); };
      im.onerror = no; im.src = r.result; };
    r.onerror = no; r.readAsDataURL(file);
  });
}
function openAdmin(){ adm.hidden = false; document.body.style.overflow = "hidden"; renderAdmin(); }
function closeAdmin(){ adm.hidden = true; document.body.style.overflow = ""; if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search); }

function renderAdmin(){
  const box = h => { adm.innerHTML = `<div class="ap"><div class="dh"><h2>${a("title")}</h2><button class="x" data-a="close" aria-label="${a("close")}">×</button></div><div class="db">${h}</div></div>`; };
  if (!ADMIN_HASH || pwMode){
    box(`<h3>${a("create")}</h3><label>${a("pw")}</label><input class="f" id="p1" type="password" autocomplete="new-password"><label>${a("pw2")}</label><input class="f" id="p2" type="password" autocomplete="new-password"><div class="err" id="pe"></div><div class="ab"><button class="btn" data-a="setpw">${a("createBtn")}</button></div><p class="note">${a("help")}</p>`);
    return;
  }
  if (!unlocked){
    box(`<label>${a("pw")}</label><input class="f" id="p1" type="password" autocomplete="current-password"><div class="err" id="pe"></div><div class="ab"><button class="btn" data-a="login">${a("login")}</button></div>`);
    return;
  }
  const e = editing ? find(editing) : null;
  const opts = CATEGORIES.map(c => `<option value="${c.id}" ${e&&e.cat===c.id?"selected":""}>${nm(c)}</option>`).join("");
  const rows = PRODUCTS.map(p => `<div class="item"><img src="${p.img||ph(p)}" alt=""><div><strong>${esc(nm(p))}</strong><div>${money(p.price)}</div></div><div class="ab" style="margin:0"><button class="btn ghost sm" data-a="edit" data-id="${p.id}">${a("editBtn")}</button><button class="btn del sm" data-a="del" data-id="${p.id}">${a("del")}</button></div></div>`).join("");
  box(`<div class="help">${a("help")}</div><div class="ag"><div>
    <h3>${e?a("edit"):a("add")}</h3>
    <label>${a("nameFr")}</label><input class="f" id="aFr" value="${esc(e?e.fr:"")}">
    <label>${a("nameAr")}</label><input class="f" id="aAr" dir="rtl" value="${esc(e?e.ar:"")}">
    <label>${a("cat")}</label><select class="f" id="aCat">${opts}</select>
    <label>${a("price")}</label><input class="f" id="aPrice" type="number" min="1" step="1" inputmode="numeric" value="${e?e.price:""}">
    <label>${a("img")}</label><input class="f" id="aImg" type="file" accept="image/*">
    <img class="prev" id="prev" alt="" ${imgData?`src="${imgData}"`:"hidden"}>
    <div class="err" id="ae"></div>
    <div class="ab"><button class="btn" data-a="save">${a("save")}</button>${e?`<button class="btn ghost" data-a="cancel">${a("cancel")}</button>`:""}</div>
  </div><div><h3>${a("list")} (${PRODUCTS.length})</h3><div class="al">${rows}</div></div></div>
  <div class="ab"><button class="btn" data-a="export">${a("export")}</button><button class="btn ghost" data-a="reset">${a("reset")}</button><button class="btn ghost" data-a="chpw">${a("chpw")}</button><button class="btn ghost" data-a="logout">${a("logout")}</button></div>`);
}

adm.addEventListener("click", async ev => {
  if (ev.target === adm) return closeAdmin();
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const k = b.dataset.a, id = b.dataset.id;
  if (k === "close") closeAdmin();
  else if (k === "login"){
    if (await hashPw($("#p1").value) === ADMIN_HASH){ unlocked = true; try { sessionStorage.setItem("adm","1"); } catch(e){} renderAdmin(); }
    else $("#pe").textContent = a("bad");
  }
  else if (k === "setpw"){
    const p1 = $("#p1").value, p2 = $("#p2").value;
    if (p1.length < 8) $("#pe").textContent = a("short");
    else if (p1 !== p2) $("#pe").textContent = a("mism");
    else { ADMIN_HASH = await hashPw(p1); unlocked = true; pwMode = false; try { sessionStorage.setItem("adm","1"); } catch(e){} saveDraft(); renderAdmin(); }
  }
  else if (k === "logout"){ unlocked = false; try { sessionStorage.removeItem("adm"); } catch(e){} renderAdmin(); }
  else if (k === "chpw"){ pwMode = true; renderAdmin(); }
  else if (k === "edit"){ editing = id; const p = find(id); imgData = p.img || ""; renderAdmin(); }
  else if (k === "cancel"){ editing = null; imgData = ""; renderAdmin(); }
  else if (k === "del"){
    if (!confirm(a("confirmDel"))) return;
    PRODUCTS = PRODUCTS.filter(p => p.id != id); if (editing == id){ editing = null; imgData = ""; }
    saveDraft(); renderGrid(); renderCart(); renderAdmin();
  }
  else if (k === "save"){
    let fr = clean($("#aFr").value), ar = clean($("#aAr").value);
    const price = parseInt($("#aPrice").value, 10), pc = $("#aCat").value;
    fr = fr || ar; ar = ar || fr;
    if (!fr || !(price > 0)){ $("#ae").textContent = a("errF"); return; }
    const old = editing ? find(editing) : null, co = CATEGORIES.find(c => c.id === pc);
    const p = {id: old ? old.id : Math.max(0, ...PRODUCTS.map(x => x.id)) + 1, cat: pc, price, e: (old && old.cat === pc && old.e) || co.e, c: (old && old.c) || "#0f4c3a", img: imgData, fr, ar};
    PRODUCTS = old ? PRODUCTS.map(x => x.id == old.id ? p : x) : [...PRODUCTS, p];
    editing = null; imgData = "";
    if (saveDraft()) toast(a("saved"));
    renderGrid(); renderCart(); renderAdmin();
  }
  else if (k === "export"){
    const txt = "/* Generated by the store admin panel. Upload this file next to index.html. */\nwindow.STORE_DATA=" + JSON.stringify({products:PRODUCTS, adminHash:ADMIN_HASH}) + ";\n";
    const u = URL.createObjectURL(new Blob([txt], {type:"text/javascript"})), l = document.createElement("a");
    l.href = u; l.download = "products.js"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
  }
  else if (k === "reset"){
    if (!confirm(a("confirmReset"))) return;
    try { localStorage.removeItem("draft"); } catch(e){}
    location.reload();
  }
});
adm.addEventListener("change", async ev => {
  if (ev.target.id !== "aImg" || !ev.target.files[0]) return;
  try { imgData = await resizeImg(ev.target.files[0]); const pv = $("#prev"); pv.src = imgData; pv.hidden = false; } catch(e){}
});
adm.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.type === "password"){ const bt = adm.querySelector("[data-a=login],[data-a=setpw]"); if (bt) bt.click(); }
});

function fillWilayas(){ $("#wilayas").innerHTML = WILAYAS.map((w,i) => `<option value="${i+1} - ${w[lang==="ar"?1:0]}">`).join(""); }
$("#waLink").href = "https://wa.me/" + WHATSAPP_NUMBER;

applyLang();

if (location.hash === "#admin") openAdmin();
